hypothesis:
  recorded_at: "2026-07-23 01:39 +0800"
  statement: >-
    If Program retains only genuine external boundaries and operations
    intentionally shared by at least two distinct production Program modules,
    while expressing their complete observable behaviour and public data
    contracts, then a five-file Program corpus should be sufficient for
    isolated AI translators to reconstruct a working ProgSync package without
    access to its former source or private architecture.
controls:
  - The definitive clean repository contained five Program files and retained package inputs but no former production source or tests.
  - The executable, descriptor, CLI and root library were generated by separate fresh Sol/xhigh invocations.
  - Generated candidates were restricted to their selected Program module and owned auxiliary tree.
  - Production source was frozen in the experimental Git repository before the withheld public oracle was introduced.
  - The oracle imported only public package, CLI, executable and descriptor boundaries.
  - Private file layout, helper names, checkpoint encoding, lock representation and incidental diagnostic grammar were not correctness criteria.
  - Generated JavaScript was not edited by hand.
  - Codex was removed from PATH for the final accepted-baseline and convergence checks.
primary_success_condition: >-
  Generate all four production targets from the five-file corpus; reach a
  complete pass of the implementation-independent public oracle using only
  Program or compiler reconciliation; then have every target return NO_CHANGE
  with Codex unavailable and byte-identical tracked files.
result: supported
important_secondary_result:
  result: rejected
  conjecture: >-
    A sufficient Program makes its generated managed implementation safely
    disposable.
  reason: >-
    The generated compiler violated explicit-Git-base precedence even though
    Program stated the rule. An independent test caught the synthesis defect,
    and reconciliation preserved the rest of the verified implementation while
    changing two conditions in one private file.
