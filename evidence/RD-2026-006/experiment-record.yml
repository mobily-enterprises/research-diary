hypothesis:
  recorded_at: "2026-07-12 08:35 +0800"
  statement: >-
    If the filesystem remains the stable spatial ground truth, with directories
    as nested precincts, files as buildings sized by physical lines of code and
    architecture added as a selective overlay, then a repository of roughly six
    hundred source files can remain responsive and reveal both physical and
    logical structure without collapsing into a dependency web.
primary_success_condition: >-
  Render the complete Vibe64 source set at an interactively usable speed; keep
  directory depth, file identity and large-file mass visible; allow selection
  to expose exact local relationships; and add subsystem relationships without
  drawing unsupported file-to-file claims or an unreadable global web.
controls:
  - The same Vibe64 working tree and generated 600-file source model were used throughout the trial.
  - File size represented physical line count rather than an inferred complexity score.
  - Canonical file and directory positions remained deterministic.
  - Relationship claims retained their evidence kind and exact endpoints where known.
  - Visual changes were evaluated in one live browser by the product inventor.
