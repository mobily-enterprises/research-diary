controls:
- Same pre-fix source revisions and preserved pre-existing edits.
- Common candidate CLI version 0.133.3 and tool-loop design.
- Candidate metadata records reasoning effort high.
- Root agent instructions and expanded Genesis guidance were supplied in the candidate
  prompts.
deviations:
- Task wording and follow-up prompts were not byte-identical; Grok received a Look
  harder follow-up.
- Initial sandbox failures interrupted all candidate sessions before substantive tool
  access.
- Dependency setup differed; the comparison copies were not reimaged between all runs.
- GLM and Grok base-instruction metadata was empty; DeepSeek metadata was nonempty.
  Actual provider request bodies were not examined.
- GLM historical worktree tests shared dependencies with another checkout, mixing
  workspace module instances.
- Sampling seeds, effective reasoning budgets and provider-side settings were not
  controlled.
evaluation_method: Retrospective manual trace inspection and finding-level comparison,
  with targeted source reads and one independent control test. Concerns in intermediate
  reasoning are distinguished from final actionable findings. No aggregate accuracy
  or recall percentage is calculated.
control_test:
  purpose: Check whether the terminal-reuse failure attributed to older code persists
    in the normal pre-fix checkout.
  command: npm test -- --test-name-pattern='^OpenCode reuses its terminal without
    creating prompt actor state$' --test-timeout=10000 tests/server/opencodeTerminal.unit.test.js
  passed: 1
  failed: 0
  approximate_duration_ms: 698
  setup_observation: Relative fixture import and bare package import resolved to distinct
    terminal-registry modules in the shared-dependency worktree.
  interpretation: The evidence points to a setup artifact; the historical run did
    not establish a pre-existing product failure.
