result: inconclusive
conclusion: The recorded candidates selected materially different investigations despite
  common tooling. Their trace differences are observed; exclusive attribution to model
  training and general model rankings remain unproven.
limitations:
- One repository case and one session per candidate.
- No preregistered scoring threshold or blinded evaluation.
- Reference findings are not guaranteed to be a complete defect oracle.
- Reference reviewer used a different CLI and reasoning effort and is not a matched
  arm.
- No live paid-provider call established account misuse or billing expenditure.
- No repeated-run reliability, latency, cost or frontier-model comparison was measured.
privacy: Only structured findings, source identifiers and hashes are public. Complete
  transcripts, raw tool outputs and financial records remain private.
next_test: Freeze request payloads, dependencies and budgets; preregister the rubric
  and repeat candidate runs; then vary mandatory verification gates separately.
